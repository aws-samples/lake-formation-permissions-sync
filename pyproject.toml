[project]
name = "lake-formation-permissions-sync"
version = "2.0.0"
description = "Cross-region replication for AWS Lake Formation permissions, Glue catalog, and Iceberg metadata"
requires-python = ">=3.10"
license = { text = "MIT-0" }

dependencies = [
    "boto3>=1.28.0,<2.0.0",
    "botocore>=1.31.0,<2.0.0",
    "aws-cdk-lib==2.245.0",
    "constructs>=10.0.0,<11.0.0",
    "streamlit",
    "plotly",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=5.0.0",
    "flake8",
    "black",
    "isort",
    "mypy",
    "boto3-stubs",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.flake8]
max-line-length = 120
ignore = ["W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=batch/script --cov=realtime/shared --cov-report=term-missing --cov-fail-under=70"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
