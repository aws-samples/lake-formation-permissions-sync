<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Lake Formation Sync</title>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg:#fafafa; --white:#fff; --text:#1a1a2e; --text-secondary:#6b7280;
  --text-tertiary:#9ca3af; --border:#e5e7eb; --border-light:#f3f4f6;
  --accent:#6366f1; --accent-light:#eef2ff; --accent-hover:#4f46e5;
  --green:#10b981; --green-light:#ecfdf5; --green-text:#065f46;
  --red:#ef4444; --red-light:#fef2f2; --red-text:#991b1b;
  --amber:#f59e0b; --amber-light:#fffbeb; --amber-text:#92400e;
  --blue:#3b82f6; --blue-light:#eff6ff;
  --radius:12px; --radius-sm:8px; --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05); --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 4px 12px rgba(0,0,0,.08);
  --transition:all .2s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;}

/* Layout */
.layout{display:flex;min-height:100vh;}
.sidebar{width:240px;background:var(--white);border-right:1px solid var(--border);padding:20px 0;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50;}
.sidebar-logo{padding:0 20px 24px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;letter-spacing:-.3px;}
.sidebar-logo svg{width:28px;height:28px;}
.sidebar-nav{flex:1;padding:0 8px;}
.nav-section{padding:16px 12px 6px;font-size:11px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--radius-sm);color:var(--text-secondary);font-size:13.5px;font-weight:500;cursor:pointer;transition:var(--transition);margin-bottom:1px;}
.nav-item:hover{background:var(--border-light);color:var(--text);}
.nav-item.active{background:var(--accent-light);color:var(--accent);}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;min-width:20px;text-align:center;}
.sidebar-footer{padding:12px 20px;border-top:1px solid var(--border);}
.main{margin-left:240px;flex:1;min-height:100vh;}
.topbar{position:sticky;top:0;background:rgba(250,250,250,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:0 32px;height:56px;display:flex;align-items:center;justify-content:space-between;z-index:40;}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:-.2px;}
.topbar-actions{display:flex;align-items:center;gap:8px;}
.content{padding:28px 32px;}

/* Components */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--white);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:var(--transition);font-family:inherit;white-space:nowrap;}
.btn:hover{border-color:#d1d5db;box-shadow:var(--shadow-sm);}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:0 2px 8px rgba(99,102,241,.3);}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px;}
.btn-ghost{border-color:transparent;background:transparent;}
.btn-ghost:hover{background:var(--border-light);border-color:transparent;box-shadow:none;}
.btn-danger{color:var(--red);border-color:var(--red);}
.btn-danger:hover{background:var(--red);color:#fff;}
.btn-success{color:var(--green);border-color:var(--green);}
.btn-success:hover{background:var(--green);color:#fff;}

.card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:24px;transition:var(--transition);}
.card:hover{box-shadow:var(--shadow);}
.card-flat{box-shadow:none;}
.card-flat:hover{box-shadow:none;}

.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.badge-green{background:var(--green-light);color:var(--green-text);}
.badge-red{background:var(--red-light);color:var(--red-text);}
.badge-amber{background:var(--amber-light);color:var(--amber-text);}
.badge-blue{background:var(--blue-light);color:var(--accent);}
.badge-neutral{background:var(--border-light);color:var(--text-secondary);}

.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.dot-green{background:var(--green);}
.dot-red{background:var(--red);}
.dot-amber{background:var(--amber);}
.dot-blue{background:var(--accent);}
.pulse{animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

.grid{display:grid;gap:16px;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.gap-20{gap:20px;}
.gap-24{gap:24px;}
.mt-20{margin-top:20px;}
.mt-24{margin-top:24px;}
.mt-16{margin-top:16px;}
.mt-12{margin-top:12px;}
.mt-8{margin-top:8px;}

/* Tables — Attio-style clean tables */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:10px 16px;font-size:12px;font-weight:600;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--bg);}
td{padding:12px 16px;border-bottom:1px solid var(--border-light);font-size:13.5px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(99,102,241,.02);}
.td-mono{font-family:'SF Mono','Fira Code',monospace;font-size:12px;color:var(--text-secondary);}

/* Inputs */
input,select,textarea{font-family:inherit;font-size:13.5px;padding:9px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--white);color:var(--text);width:100%;transition:var(--transition);outline:none;}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.1);}
input::placeholder{color:var(--text-tertiary);}
label{display:block;font-size:12.5px;font-weight:500;color:var(--text-secondary);margin-bottom:5px;}

/* Progress bar */
.progress-bar{height:4px;background:var(--border-light);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;border-radius:2px;transition:width .6s ease;}

/* Stat card */
.stat-label{font-size:12.5px;color:var(--text-secondary);font-weight:500;}
.stat-value{font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.1;margin-top:6px;}
.stat-change{font-size:12px;font-weight:500;margin-top:6px;display:flex;align-items:center;gap:4px;}

/* Empty state */
.empty-state{text-align:center;padding:60px 20px;color:var(--text-secondary);}
.empty-state svg{width:48px;height:48px;color:var(--text-tertiary);margin-bottom:16px;}
.empty-state h3{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px;}
.empty-state p{font-size:13px;max-width:360px;margin:0 auto;}

/* Modal — Attio style: centered, subtle shadow */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:200;animation:fadeIn .15s ease;}
.modal{background:var(--white);border-radius:var(--radius-lg);padding:0;width:520px;max-height:85vh;overflow:hidden;box-shadow:0 24px 48px rgba(0,0,0,.12);animation:slideUp .2s ease;}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-header h2{font-size:16px;font-weight:600;letter-spacing:-.2px;}
.modal-body{padding:24px;overflow-y:auto;max-height:calc(85vh - 140px);}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;background:var(--bg);}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* Timeline */
.timeline-item{display:flex;gap:12px;padding:12px 0;position:relative;}
.timeline-icon{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;}
.timeline-content{flex:1;min-width:0;}
.timeline-title{font-size:13.5px;font-weight:500;}
.timeline-time{font-size:12px;color:var(--text-tertiary);}
.timeline-line{position:absolute;left:15px;top:44px;bottom:-12px;width:1px;background:var(--border-light);}

/* Credential card */
.cred-field{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);border-radius:var(--radius-sm);margin-bottom:8px;}
.cred-field label{margin:0;width:140px;flex-shrink:0;font-size:12.5px;}
.cred-field input{background:var(--white);}

/* Scrollbar */
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:3px;}
::-webkit-scrollbar-thumb:hover{background:#9ca3af;}

@media(max-width:900px){.sidebar{display:none;}.main{margin-left:0;}.grid-3,.grid-4{grid-template-columns:repeat(2,1fr);}.grid-2{grid-template-columns:1fr;}.content{padding:20px 16px;}}
</style>
</head>
